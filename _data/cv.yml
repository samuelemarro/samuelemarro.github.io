  - name: Profile
    value: I'm a PhD student at Oxford under Philip Torr, and I run the Institute for Decentralized AI, a joint Oxford-Stanford research institute. The institute is funded by 1M USD in grants by OpenAI, Anthropic, Google, Microsoft, and the UK ARIA. I lead a team of 15 people to build the new generation of successfully decentralized AI systems.
